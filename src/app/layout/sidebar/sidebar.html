<header class="sidebar top-navbar">
  <div class="nav-container">
    <a
      class="brand"
      routerLink="/dashboard"
      (click)="onTabClick('/dashboard')"
      aria-label="1:1:1 Warehouse, go to Dashboard"
    >
      <span class="brand-logo">
        <img src="images/LCC.jpeg" alt="NGO logo" />
      </span>
      <span class="brand-text">
        <strong>1:1:1</strong>
        <small>WAREHOUSE</small>
      </span>
    </a>

    <nav
      #navLinks
      id="warehouse-navigation"
      class="nav-links"
      [class.mobile-open]="isMobileMenuOpen"
      aria-label="Main navigation"
    >
      <span #navSlider class="nav-slider" aria-hidden="true"></span>

      <a
        *ngFor="let item of menuItems"
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (isActiveChange)="onActiveChange(item.route, $event)"
        (click)="onTabClick(item.route)"
      >
        {{ item.name }}
      </a>

      <button
        type="button"
        class="logout-btn mobile-logout"
        (click)="onLogout()"
      >
        <span aria-hidden="true">↪</span> Logout
      </button>
    </nav>

    <div class="nav-actions">
      <button
        type="button"
        class="logout-btn desktop-logout"
        (click)="onLogout()"
      >
        <span aria-hidden="true">↪</span> Logout
      </button>

      <button
        type="button"
        class="mobile-toggle-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="warehouse-navigation"
        [attr.aria-label]="isMobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'"
      >
        <span class="bar bar-1" [class.bar-1-open]="isMobileMenuOpen"></span>
        <span class="bar bar-2" [class.bar-2-open]="isMobileMenuOpen"></span>
        <span class="bar bar-3" [class.bar-3-open]="isMobileMenuOpen"></span>
      </button>
    </div>
  </div>
</header>

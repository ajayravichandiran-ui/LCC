<header class="sidebar top-navbar">
  <div class="nav-container">
    <a
      class="brand"
      routerLink="/dashboard"
      (click)="goToDashboard($event); closeMobileMenu()"
      title="Go to Dashboard"
    >
      <div class="brand-logo">
        <img src="images/LCC.jpeg" alt="LCC Warehouse Logo" />
      </div>
      <div class="brand-text">
        <h2>111</h2>
        <p>WAREHOUSE</p>
      </div>
    </a>

    <!-- Navigation links (Desktop & Mobile Dropdown) -->
    <nav class="nav-links" [class.mobile-open]="isMobileMenuOpen">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        {{ item.name }}
      </a>
      <button class="nav-link logout-btn mobile-logout" type="button" (click)="onLogout()">
        Logout
      </button>
    </nav>

    <div class="nav-actions">
      <button class="nav-link logout-btn desktop-logout" type="button" (click)="onLogout()">
        Logout
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button
        type="button"
        class="mobile-toggle-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle navigation menu"
      >
        <span class="bar bar-1" [class.bar-1-open]="isMobileMenuOpen"></span>
        <span class="bar bar-2" [class.bar-2-open]="isMobileMenuOpen"></span>
        <span class="bar bar-3" [class.bar-3-open]="isMobileMenuOpen"></span>
      </button>
    </div>
  </div>
</header>

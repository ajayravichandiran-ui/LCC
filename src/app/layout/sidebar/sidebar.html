<aside class="sidebar">
  <div class="brand">
    <div class="brand-logo">
      <img src="images/LCC.jpeg" alt="LCC Warehouse Logo" />
    </div>
    <div class="brand-text">
      <h2>LCC</h2>
      <p>WAREHOUSE</p>
    </div>
  </div>

  <nav class="menu">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item"
    >
      <span class="menu-icon">{{ item.icon }}</span>
      <span>{{ item.name }}</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button class="menu-item logout" type="button" (click)="onLogout()">
      <span class="menu-icon">&#128682;</span>
      <span>Logout</span>
    </button>
  </div>
</aside>

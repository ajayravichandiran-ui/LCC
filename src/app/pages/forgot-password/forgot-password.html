
<div class="forgot-container">
  <div class="forgot-card">

    <h2>Forgot Password?</h2>
    <p>Enter your registered email address.</p>

    <form (ngSubmit)="sendOtp()" #forgotForm="ngForm">

      <label for="email">Email Address</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
        email
        #emailInput="ngModel">

      <p class="error"
         *ngIf="emailInput.invalid && emailInput.touched">
        Please enter a valid email address.
      </p>

      <button type="submit" [disabled]="forgotForm.invalid">
        Send OTP
      </button>

    </form>

    <div *ngIf="otpSent" class="otp-section">
      <h3>Verify Your Email</h3>
      <p>Enter the 6-digit OTP sent to your email.</p>

      <div class="otp-boxes">
        <input
          *ngFor="let digit of otpDigits; let i = index"
          type="text"
          maxlength="1"
          inputmode="numeric"
          [(ngModel)]="otpDigits[i]"
          [name]="'otp' + i"
          (input)="moveNext($event, i)">
      </div>

      <button type="button" (click)="verifyOtp()">
        Verify OTP
      </button>

      <p class="message">{{ message }}</p>
    </div>

    <a routerLink="/login">← Back to Login</a>

  </div>
</div>

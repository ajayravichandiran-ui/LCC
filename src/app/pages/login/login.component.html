<!-- =====================================================
     ULTRA-DARK INITIAL CINEMATIC SCREEN (#02050B)
===================================================== -->
<div
  class="dark-stage"
  *ngIf="isDarkScreen"
  [class.lamp-lit]="isLampTriggered"
  [class.fading-out]="isPageRevealed">

  <!-- Ultra-Dark Ambient Background -->
  <div class="dark-atmosphere">
    <!-- Subtle Depth Gradients -->
    <div class="dark-gradient-radial"></div>
    <div class="dark-vignette"></div>

    <!-- Tiny Dim Floating Particles -->
    <div
      *ngFor="let p of particles"
      class="dim-particle"
      [style.left.%]="p.x"
      [style.top.%]="p.y"
      [style.width.px]="p.size"
      [style.height.px]="p.size"
      [style.animationDelay.s]="p.delay">
    </div>
  </div>

  <!-- Tiny Faint Glowing Butterfly Particles (Only 3 subtle ones) -->
  <div class="butterfly-particles-layer">

    <!-- Butterfly Particle 1 (Faint Golden Highlight) -->
    <div class="butterfly-particle bf-1">
      <div class="bf-wings">
        <span class="bf-wing bf-left gold-tint"></span>
        <span class="bf-body"></span>
        <span class="bf-wing bf-right gold-tint"></span>
      </div>
      <div class="bf-glow gold-glow"></div>
    </div>

    <!-- Butterfly Particle 2 (Faint Soft Blue Highlight) -->
    <div class="butterfly-particle bf-2">
      <div class="bf-wings">
        <span class="bf-wing bf-left blue-tint"></span>
        <span class="bf-body"></span>
        <span class="bf-wing bf-right blue-tint"></span>
      </div>
      <div class="bf-glow blue-glow"></div>
    </div>

    <!-- Butterfly Particle 3 (Faint Golden Highlight) -->
    <div class="butterfly-particle bf-3">
      <div class="bf-wings">
        <span class="bf-wing bf-left gold-tint"></span>
        <span class="bf-body"></span>
        <span class="bf-wing bf-right gold-tint"></span>
      </div>
      <div class="bf-glow gold-glow"></div>
    </div>

  </div>

  <!-- Main Focus: Realistic Hanging Textured Brown Rope (Left Side) -->
  <div
    class="rope-container"
    [class.swaying]="ropeSwinging"
    [class.rope-retracting]="isLampTriggered"
    [style.transform]="'translateY(' + ropeY + 'px)'"
    (mousedown)="onRopePointerDown($event)"
    (touchstart)="onRopePointerDown($event)"
    (click)="triggerPull()"
    title="Pull or click rope to enter"
    role="button"
    tabindex="0"
    aria-label="Pull rope to enter">

    <!-- The Realistic Textured Brown Rope (Slim & Sleek) -->
    <div class="brown-rope" [style.height.px]="175 + (ropeY > 0 ? ropeY * 0.35 : 0)">
      <div class="rope-texture"></div>
      <div class="rope-fibers"></div>
      <div class="rope-highlight"></div>
    </div>

    <!-- Small Sleek Knot Handle at Bottom -->
    <div class="rope-knot-handle">

      <!-- Coiled Rope Knot -->
      <div class="knot-ball">
        <span class="coil coil-1"></span>
        <span class="coil coil-2"></span>
        <span class="coil coil-3"></span>
      </div>

      <!-- Small frayed rope fringe below knot -->
      <div class="knot-fringe">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Ambient Golden Illumination on Rope Pull (No Hanging Lamp) -->
  <div class="illumination-layer" *ngIf="isLampTriggered">
    <div class="golden-light-burst"></div>
    <div class="golden-illumination-wave"></div>
  </div>

</div>

<!-- =====================================================
     EXISTING SANMARKKAM.ORG LOGIN PAGE (100% PRESERVED)
===================================================== -->
<div class="page" [class.page-revealed]="!isDarkScreen || isLampTriggered">

  <!-- ================= LEFT SIDE (BRAND & HERO) ================= -->
  <section class="left">

    <!-- Decorative dots -->
    <div class="dots" aria-hidden="true">
      <i></i><i></i><i></i>
      <i></i><i></i><i></i>
      <i></i><i></i><i></i>
    </div>

    <!-- Brand Header -->
    <div class="brand">
      <div
        class="logo"
        (click)="refreshPage()"
        title="Refresh Page"
        tabindex="0"
        role="button">
        <img
          src="/asset/logo.png"
          alt="Sanmarkkam Logo">
      </div>

      <div class="brand-content">
        <h1>
          sanmarkkam<span>.org</span>
        </h1>
        <p>
          Share &nbsp;•&nbsp; Support &nbsp;•&nbsp; Build a Better Tomorrow
        </p>
      </div>
    </div>

    <!-- Message Content -->
    <div class="message">
      <h2>
        Your Kindness<br>
        Creates <span>Change</span>
      </h2>

      <div class="impact-tags">
        <span class="impact-tag"><b>•</b> Food</span>
        <span class="impact-tag"><b>•</b> Care</span>
        <span class="impact-tag"><b>•</b> Hope</span>
      </div>
    </div>

    <!-- Image Slider -->
    <div class="photo-slider">
      <div
        class="slides-track"
        [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
        <div
          class="slide"
          *ngFor="let image of images; let i = index">
          <img
            [src]="image"
            alt="Helping person">
        </div>
      </div>

      <div class="wave"></div>

      <div class="slider-dots">
        <button
          *ngFor="let image of images; let i = index"
          type="button"
          [class.active]="currentSlide === i"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Slide ' + (i + 1)">
        </button>
      </div>
    </div>

  </section>

  <!-- ================= RIGHT SIDE (AUTH FORM) ================= -->
  <section class="right">

    <div class="right-container">

      <!-- Company Brand Pill -->
      <div class="logo-container">
        <img
          src="/asset/logo1.png"
          alt="Opon Logo"
          class="company-logo"
        />

        <div class="logo-text">
          <span class="logo-sub">ஒரு பொருள்</span>
          <span class="logo-main">ஒரு நபர்</span>
        </div>
      </div>

      <!-- Login Card -->
      <div class="card">

        <div class="welcome">
          WELCOME BACK
        </div>

        <h2>Sign In</h2>

        <p class="desc">
          Enter your username and password to continue
        </p>

        <form (ngSubmit)="loginUser()">

          <!-- Username -->
          <div class="input-box">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              [(ngModel)]="username"
              placeholder="Enter username"
              autocomplete="username"
              required>
          </div>

          <!-- Password -->
          <div class="input-box">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input
                id="password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>
              <button
                class="eye"
                type="button"
                (click)="togglePassword()"
                aria-label="Show or hide password">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="19"
                  height="19"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Options Row -->
          <div class="remember-row">
            <label class="remember-label">
              <input
                type="checkbox"
                name="rememberMe"
                [(ngModel)]="rememberMe">
              <span>Remember me</span>
            </label>
            <a routerLink="/forgot-password" class="forgot-link">
              Forgot password?
            </a>
          </div>

          <!-- Login Button -->
          <button
            class="login"
            type="submit">
            Login &nbsp; →
          </button>

        </form>

        <!-- Sign Up Link -->
        <div class="signup-text">
          Don't have an account?
          <a routerLink="/signup">Sign Up</a>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span></span>
          <div>OR</div>
          <span></span>
        </div>

        <!-- Footer -->
        <div class="footer">
          Secure Login
          <b>•</b>
          Easy Access
          <b>•</b>
          Better Together
        </div>

      </div>

    </div>

  </section>

</div>
